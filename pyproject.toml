[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beadspring"
version = "0.2.0"
description = "Analysis utilities for bead-spring polymer simulations"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Utku Gürel"}]
license = {file = "LICENSE.txt"}
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
]

[project.optional-dependencies]
docs = ["sphinx>=7.0"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
analysis = [
    "MDAnalysis>=2.5",
    "freud-analysis>=2.12",
]

[project.urls]
Homepage = "https://github.com/utkugurel/bead-spring"

[tool.setuptools.packages.find]
include = ["beadspring*"]
