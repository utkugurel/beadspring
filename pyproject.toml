[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beadspring"
version = "0.2.0"
description = "Analysis utilities for bead-spring polymer simulations"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Utku Gürel"}]
license = {file = "LICENSE.txt"}
dependencies = [
    "numpy==1.26.3",
    "scipy==1.12.0",
    "MDAnalysis==2.6.1",
    "freud-analysis==2.13.2",
    "numba==0.59.0",
]

[project.optional-dependencies]
docs = ["sphinx>=7.0"]
dev = [
    "pytest==8.0.0",
    "pytest-cov>=4.1",
    "ruff>=0.1.0",
    "ipython==8.20.0",
]
analysis = [
    "matplotlib==3.8.2",
    "pandas==2.2.0",
    "scikit-learn==1.4.0",
    "dask==2023.11.0",
    "signac==2.1.0",
    "signac-flow==0.26.1",
    "pyprojroot==0.3.0",
]

[project.urls]
Homepage = "https://github.com/utkugurel/bead-spring"

[tool.hatch.build.targets.wheel]
packages = ["beadspring"]

